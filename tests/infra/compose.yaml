services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: cdc-test-only
      MYSQL_ROOT_HOST: "%"
    ports:
      - "127.0.0.1:13306:3306"
    command:
      - --server-id=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --binlog-row-image=${CDC_TEST_ROW_IMAGE:-minimal}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pcdc-test-only"]
      interval: 2s
      timeout: 2s
      retries: 60

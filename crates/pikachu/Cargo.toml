[package]
name = "pikachu"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "MySQL CDC command line powered by mysql-canal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tiyee/mysql-cdc-rs"
keywords = ["mysql", "cdc", "binlog", "replication"]
categories = ["database", "command-line-utilities"]
publish = ["crates-io"]
include = ["/src/**", "/examples/**", "/tests/**", "/Cargo.lock", "/README.md", "/README.zh-CN.md", "/LICENSE", "!**/.DS_Store"]
autotests = false

[dependencies]
mysql-canal = { path = "../mysql-canal", version = "=2.0.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
serde_json = "1"
crc32fast = "1"

[[test]]
name = "cli"
path = "tests/integration/cli.rs"

[[test]]
name = "mysql_live"
path = "tests/integration/mysql_live.rs"

[package]
name = "mysql-replication"
version = "2.0.0"
edition = "2024"
rust-version = "1.89"
description = "Borrowed MySQL binlog events, replication transport and file parsing"
license = "MIT"
readme = "README.md"
repository = "https://github.com/tiyee/mysql-cdc-rs"
documentation = "https://docs.rs/mysql-replication"
keywords = ["mysql", "cdc", "binlog", "replication"]
categories = ["database"]
publish = ["crates-io"]
include = ["/src/**", "/examples/**", "/tests/**", "/benches/**", "/README.md", "/README.zh-CN.md", "/LICENSE", "!**/.DS_Store"]
autotests = false

[dependencies]
mysql = { version = "28", default-features = false, features = ["minimal-rust", "binlog", "rustls-tls-ring"] }
mysql_common = { version = "0.37", default-features = false, features = ["binlog"] }
thiserror = "2"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }

[[test]]
name = "events"
path = "tests/events.rs"

[[test]]
name = "mysql_live"
path = "tests/mysql_live.rs"

[[example]]
name = "decode_typed_rows"
test = true

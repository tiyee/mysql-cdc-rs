name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, Clippy and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test release version guard
        run: python -m unittest discover -s scripts/release -p 'test_*.py'

  rust:
    name: Rust ${{ matrix.toolchain }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: "1.89.0"
          - os: ubuntu-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Test protocol, CDC, facade, CLI and generic row example contracts
        # Includes the registered example harness and compile-fail doctests.
        run: cargo test --workspace --locked
      - name: Compile library, CLI, examples and benchmarks
        run: cargo check --workspace --all-targets --locked

  mysql:
    name: MySQL integration
    uses: ./.github/workflows/mysql.yml

  package:
    name: Verify crates.io package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the packaged source without uploading
        run: cargo publish --workspace --dry-run --locked --registry crates-io
      - name: Compile tests from the packaged files
        run: |
          stage=$(mktemp -d)
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '[.packages[].version] | unique | select(length == 1) | first')
          for name in mysql-replication mysql-canal mysql-cdc-rs pikachu; do
            tar -xzf "target/package/tmp-crate/$name-$version.crate" -C "$stage"
          done
          cp Cargo.lock "$stage/Cargo.lock"
          cd "$stage"
          cat > Cargo.toml <<EOF
          [workspace]
          members = ["mysql-*", "pikachu-*"]
          resolver = "3"
          [patch.crates-io]
          mysql-replication = { path = "mysql-replication-$version" }
          mysql-canal = { path = "mysql-canal-$version" }
          EOF
          cargo test --workspace --no-run --locked

  success:
    name: CI success
    if: always()
    needs: [quality, rust, mysql, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          RUST: ${{ needs.rust.result }}
          MYSQL: ${{ needs.mysql.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          test "$QUALITY" = success
          test "$RUST" = success
          test "$MYSQL" = success
          test "$PACKAGE" = success

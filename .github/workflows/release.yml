name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require the tag to match Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release/check_version.py "$RELEASE_TAG"

  ci:
    name: Test release commit
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish library and CLI to crates.io
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish mysql-replication using an API token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --registry crates-io --package mysql-replication
      - name: Authenticate with crates.io using OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish verified CLI package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io --package pikachu-rs

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require the tag to match Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release/check_version.py "$RELEASE_TAG"

  ci:
    name: Test release commit
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish pikachu-cdc to crates.io
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish verified package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo '::error::Configure the CARGO_REGISTRY_TOKEN repository secret before releasing.'
            exit 1
          fi
          cargo publish --locked --registry crates-io --package pikachu-cdc
